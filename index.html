<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2430">
<title>Gastos del hogar</title>
<style>
  :root{
    --paper:#F4F5F8; --card:#FFFFFF; --ink:#1F2430; --muted:#6B7280; --faint:#9AA1AC;
    --line:#E7E9EE; --line2:#EEF0F4;
    --A:#E39A2E; --A-soft:#FBEBCF; --A-ink:#8A5A08;
    --B:#279E9E; --B-soft:#D2ECEC; --B-ink:#0F5F5F;
    --accent:#4B5CC4; --accent-soft:#E4E7F8;
    --ok:#2E9E6B; --warn:#E0A200; --danger:#D8503A; --danger-soft:#FBE3DE;
    --r:16px; --r-sm:11px;
    --shadow:0 1px 2px rgba(20,25,40,.06), 0 8px 24px rgba(20,25,40,.05);
    --tap:44px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.45;
    font-size:15px; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.01em}
  button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,select{font-family:inherit; font-size:16px; color:var(--ink)}
  .hidden{display:none !important}

  /* ---- top bar ---- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(244,245,248,.86);
    backdrop-filter:saturate(1.4) blur(10px);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header .title{display:flex; flex-direction:column; line-height:1.1}
  header .title b{font-size:17px}
  header .title small{color:var(--muted); font-size:12px; font-weight:600}
  .who{display:flex; gap:6px; align-items:center}
  .who-pill{
    display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px;
    font-size:12.5px; font-weight:700; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)
  }
  .dot{width:9px; height:9px; border-radius:50%}
  .dot.A{background:var(--A)} .dot.B{background:var(--B)}

  main{padding:14px 14px 20px; max-width:640px; margin:0 auto}
  .stack>*+*{margin-top:12px}

  /* ---- cards ---- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:16px}
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:12px}
  .card h2 .sub{float:right; text-transform:none; letter-spacing:0; color:var(--faint); font-weight:600}

  /* ---- period nav ---- */
  .segbar{display:flex; gap:6px; background:var(--line2); padding:4px; border-radius:999px}
  .segbar button{flex:1; padding:9px 6px; border-radius:999px; font-weight:700; font-size:13px; color:var(--muted); min-height:var(--tap)}
  .segbar button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
  .pnav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px}
  .pnav .arrow{width:var(--tap); height:var(--tap); border-radius:12px; background:var(--card); border:1px solid var(--line); font-size:20px; display:grid; place-items:center; box-shadow:var(--shadow)}
  .pnav .label{flex:1; text-align:center; font-weight:700; text-transform:capitalize}
  .pnav .today{padding:0 14px; height:var(--tap); border-radius:12px; background:var(--accent-soft); color:var(--accent); font-weight:700}

  /* ---- donut ---- */
  .donut-wrap{display:flex; flex-direction:column; align-items:center; gap:14px}
  .donut{position:relative; width:210px; height:210px}
  .donut .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
  .donut .center small{color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
  .donut .center b{font-size:26px; letter-spacing:-.02em}
  .legend{width:100%; display:flex; flex-direction:column; gap:2px}
  .legend .row{display:flex; align-items:center; gap:9px; padding:8px 4px; border-top:1px solid var(--line2)}
  .legend .row:first-child{border-top:none}
  .legend .sw{width:11px; height:11px; border-radius:3px; flex:none}
  .legend .nm{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .legend .amt{font-weight:700}
  .legend .pct{color:var(--faint); font-size:12px; width:42px; text-align:right}
  .legend .bud{font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:2px}
  .bud.near{background:#FCEFCB; color:#8A6400} .bud.over{background:var(--danger-soft); color:var(--danger)}

  /* ---- person panels ---- */
  .pgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(max-width:430px){.pgrid{grid-template-columns:1fr}}
  .ppanel{border-radius:var(--r); padding:14px; border:1px solid var(--line)}
  .ppanel.A{background:linear-gradient(180deg,var(--A-soft),#fff 70%)}
  .ppanel.B{background:linear-gradient(180deg,var(--B-soft),#fff 70%)}
  .ppanel .name{display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:10px}
  .kv{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:14px}
  .kv .k{color:var(--muted); font-weight:600}
  .kv .v{font-weight:700}
  .kv.big .v{font-size:18px}
  .kv.big .k{font-weight:700; color:var(--ink)}
  .pos{color:var(--ok)} .neg{color:var(--danger)}

  /* ---- balance hero ---- */
  .balance{display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; padding:22px 16px}
  .balance .who-owes{font-size:20px; font-weight:800; letter-spacing:-.02em}
  .balance .amt{font-size:34px; font-weight:800; letter-spacing:-.03em}
  .balance .none{color:var(--muted); font-weight:700}
  .balance .flow{display:flex; align-items:center; gap:10px; font-weight:700; color:var(--muted); font-size:13px}
  .badge-closed{display:inline-flex; gap:6px; align-items:center; background:#EEF0F4; color:var(--muted); font-weight:700; font-size:12px; padding:4px 10px; border-radius:999px}

  /* ---- lists / movimientos ---- */
  .mv{display:flex; align-items:center; gap:11px; padding:12px 4px; border-top:1px solid var(--line2)}
  .mv:first-child{border-top:none}
  .mv .cat-ic{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; font-size:15px; flex:none; color:#fff; font-weight:800}
  .mv .body{flex:1; min-width:0}
  .mv .l1{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .mv .l1 .cat{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mv .l1 .amt{font-weight:800; flex:none}
  .mv .l2{display:flex; gap:6px; align-items:center; margin-top:3px; color:var(--muted); font-size:12px; flex-wrap:wrap}
  .tag{font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; line-height:1.5}
  .tag.comun{background:var(--accent-soft); color:var(--accent)}
  .tag.indiv{background:#EEF0F4; color:var(--muted)}
  .tag.A{background:var(--A-soft); color:var(--A-ink)} .tag.B{background:var(--B-soft); color:var(--B-ink)}
  .tag.cuota{background:#EAF3EC; color:#2E7D50}
  .tag.pend{background:#FCEFCB; color:#8A6400}
  .daygroup .dhead{font-size:12px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; padding:12px 4px 2px}
  .row-actions{display:flex; gap:6px}
  .icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; font-size:15px}

  .pending-box{background:#FFF9E9; border:1px solid #F1DFA6; border-radius:var(--r); padding:14px; margin-bottom:12px}
  .pending-box h3{font-size:13px; color:#8A6400; margin-bottom:8px; text-transform:uppercase; letter-spacing:.04em}
  .pending-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #F1DFA6}
  .pending-item:first-of-type{border-top:none}
  .btn-mini{padding:8px 12px; border-radius:9px; font-weight:700; font-size:13px; min-height:38px}
  .btn-ok{background:var(--ok); color:#fff} .btn-ghost{background:var(--card); border:1px solid var(--line)}

  .empty{text-align:center; color:var(--muted); padding:34px 10px; font-weight:600}
  .empty .big{font-size:30px; margin-bottom:6px}

  /* ---- compare ---- */
  .cmp{display:flex; align-items:center; gap:10px; padding:9px 4px; border-top:1px solid var(--line2)}
  .cmp:first-child{border-top:none}
  .cmp .nm{flex:1; font-weight:600}
  .cmp .delta{font-weight:800; font-size:13px}
  .cmp .arrow{font-size:12px}

  /* ---- forms ---- */
  .field{margin-bottom:13px}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px}
  .field input,.field select{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:var(--card); min-height:var(--tap)}
  .field input:focus,.field select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  .frow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .chip{padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-weight:700; font-size:14px; min-height:var(--tap)}
  .chip.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .chip.onA{border-color:var(--A); background:var(--A-soft); color:var(--A-ink)}
  .chip.onB{border-color:var(--B); background:var(--B-soft); color:var(--B-ink)}
  .switchline{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0}
  .switch{width:50px; height:30px; border-radius:999px; background:var(--line); position:relative; transition:.15s; flex:none}
  .switch.on{background:var(--accent)}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on::after{left:23px}
  .btn{width:100%; padding:14px; border-radius:13px; font-weight:800; font-size:15px; min-height:var(--tap); background:var(--accent); color:#fff}
  .btn.secondary{background:var(--card); border:1px solid var(--line); color:var(--ink)}
  .btn.danger{background:var(--danger-soft); color:var(--danger)}
  .btn2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .hint{font-size:12px; color:var(--muted); margin-top:4px}

  /* ---- categories mgmt ---- */
  .catgroup{margin-bottom:6px}
  .catgroup .gh{font-size:12px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; padding:12px 2px 6px}
  .catline{display:flex; align-items:center; gap:10px; padding:10px 4px; border-top:1px solid var(--line2)}
  .catline:first-child{border-top:none}
  .catline .sw{width:12px; height:12px; border-radius:4px; flex:none}
  .catline .nm{flex:1; font-weight:600}
  .catline .lim{font-size:12px; color:var(--muted); font-weight:700}

  /* ---- bottom nav ---- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px; color:var(--muted); font-size:11px; font-weight:700; border-radius:12px}
  nav.tabs button .ic{font-size:20px; line-height:1}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button.add .ic{background:var(--accent); color:#fff; width:40px; height:40px; border-radius:13px; display:grid; place-items:center; font-size:24px; margin-top:-14px; box-shadow:0 6px 16px rgba(75,92,196,.4)}
  nav.tabs button.add.on{color:var(--accent)}

  /* ---- sheet / modal ---- */
  .sheet-bg{position:fixed; inset:0; background:rgba(20,25,40,.4); z-index:40; display:flex; align-items:flex-end; justify-content:center}
  .sheet{background:var(--card); width:100%; max-width:640px; border-radius:22px 22px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto}
  .sheet .grab{width:40px; height:4px; border-radius:999px; background:var(--line); margin:0 auto 14px}
  .sheet h3{font-size:18px; margin-bottom:14px}

  .toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-weight:700; font-size:13.5px; z-index:60; box-shadow:var(--shadow); opacity:0; transition:.2s; pointer-events:none}
  .toast.show{opacity:1}
  .savebar{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .status-line{font-size:12px; font-weight:700; text-align:center; margin-top:4px}
/* ---- reordenar (agarre) ---- */
.rblock{position:relative}
.grip{position:absolute; top:-9px; left:50%; transform:translateX(-50%); z-index:6; width:46px; height:18px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--faint); font-size:12px; letter-spacing:3px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); cursor:grab; touch-action:none; user-select:none}
.rblock.dragging{z-index:50; position:relative}
.rblock.dragging .card,.rblock.dragging .pgrid{box-shadow:0 12px 30px rgba(20,25,40,.22); border-color:var(--accent)}
.rblock.dragging .grip{cursor:grabbing; background:var(--accent); color:#fff; border-color:var(--accent)}
/* ---- feed de últimos gastos ---- */
.feed{display:flex; flex-direction:column}
.feed-row{display:flex; align-items:center; gap:12px; padding:11px 2px; border-top:1px solid var(--line2)}
.feed-row:first-child{border-top:none}
.feed-dot{width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 0 4px rgba(0,0,0,.03)}
.feed-body{flex:1; min-width:0}
.feed-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.feed-cat{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.feed-amt{font-weight:800; flex:none; font-size:15px}
.feed-sub{color:var(--muted); font-size:12px; margin-top:2px; text-transform:capitalize}
</style>
</head>
<body>

<header>
  <div class="title"><b>Gastos del hogar</b><small id="periodTiny">—</small></div>
  <div class="who">
    <button class="who-pill" id="whoPill"><span class="dot" id="whoDot"></span><span id="whoName">¿Quién sos?</span></button>
  </div>
</header>

<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-tab="resumen" class="on"><span class="ic">◐</span>Resumen</button>
  <button data-tab="movimientos"><span class="ic">≣</span>Movimientos</button>
  <button data-tab="cargar" class="add"><span class="ic">+</span>Cargar</button>
  <button data-tab="categorias"><span class="ic">☷</span>Categorías</button>
  <button data-tab="ajustes"><span class="ic">⚙</span>Ajustes</button>
</nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<!-- ══════════ Lógica principal (probable / sin Firebase) ══════════ -->
<script>
"use strict";
/* ---------- constantes ---------- */
var STORAGE_KEY = "gastos-hogar-v1";
var SCHEMA = 1;
var CAT_COLORS = ["#4B5CC4","#E39A2E","#279E9E","#D8503A","#7C5CBF","#2E9E6B","#E06AA0","#3B82C4","#C98A2E","#5AA05A","#B0574B","#8A6ABF","#2E9E9E","#C46A9E","#6B7280"];
var GROUPS = {
  comun_var:   "Comunes fijas · monto variable",
  comun_fija:  "Comunes fijas · monto que se repite",
  variable:    "Variables · común o individual al cargar",
  individual:  "Individuales"
};

/* categorías por defecto (según el spec) */
function defaultCategories(){
  var d=[]; var i=0;
  function add(name,group,extra){ d.push(Object.assign({id:"c"+(++i), name:name, group:group, color:CAT_COLORS[(i-1)%CAT_COLORS.length], updatedAt:0, deleted:false}, extra||{})); }
  add("Luz","comun_var"); add("Gas","comun_var"); add("Impuestos municipales","comun_var"); add("Internet","comun_var");
  add("Netflix","comun_fija",{repeat:0}); add("Prime","comun_fija",{repeat:0}); add("HBO","comun_fija",{repeat:0});
  add("Supermercado","variable"); add("Carnicería","variable"); add("Verdulería","variable"); add("Dietética","variable");
  add("Auto (seguro/patente/nafta)","variable"); add("Comida rápida","variable"); add("Tarjetas / billeteras","variable");
  add("Impuestos (monotributo/IIBB)","individual"); add("Salud / deporte","individual"); add("Suscripciones individuales","individual");
  return d;
}
function freshState(){
  return {
    schema:SCHEMA,
    names:{A:"Persona A", B:"Persona B"},
    incomes:[], expenses:[], payments:[],
    categories:defaultCategories(),
    budgets:{},              // {catId: limite}
    cards:{A:[], B:[]},
    closedMonths:[],
    metaUpdatedAt:0          // para merge de config (names/budgets/cards/closed)
  };
}

/* ---------- estado + persistencia ---------- */
var STATE = load();
var DEVICE = { person: localStorage.getItem("gastos-device-person") || null };

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    var s = JSON.parse(raw);
    if(!s.categories || !s.categories.length) s.categories = defaultCategories();
    s.incomes = s.incomes||[]; s.expenses=s.expenses||[]; s.payments=s.payments||[]; s.budgets=s.budgets||{};
    s.cards = s.cards||{A:[],B:[]}; s.closedMonths=s.closedMonths||[]; s.names=s.names||{A:"Persona A",B:"Persona B"};
    if(typeof s.metaUpdatedAt!=="number") s.metaUpdatedAt=0;
    return normalizeCards(s);
  }catch(e){ return freshState(); }
}
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
  if(window.markDirty) window.markDirty();
}
/* expuesto para el módulo Firebase */
window.GastosStore = {
  get:function(){ return STATE; },
  set:function(next){ STATE = next; persist(); render(); },
  merge:function(cloud){ STATE = mergeState(cloud, STATE); persist(); render(); return STATE; }
};

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }
function money(n){
  n = Number(n)||0;
  return n.toLocaleString("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:(Math.abs(n%1)>0?2:0)});
}
function pad(n){ return (n<10?"0":"")+n; }
function ymd(dt){ return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate()); }
function monthKey(dstr){ return String(dstr).slice(0,7); }
function parseDate(dstr){ var p=String(dstr).split("-"); return new Date(+p[0], (+p[1])-1, +p[2]||1); }
function monthLabel(mk){
  var p=mk.split("-"); var dt=new Date(+p[0],(+p[1])-1,1);
  return dt.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
}
function addMonths(mk,delta){
  var p=mk.split("-"); var dt=new Date(+p[0],(+p[1])-1+delta,1);
  return dt.getFullYear()+"-"+pad(dt.getMonth()+1);
}
function todayMonth(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function startOfWeek(dt){ var d=new Date(dt); var g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); d.setHours(0,0,0,0); return d; }
function catById(id){ for(var i=0;i<STATE.categories.length;i++) if(STATE.categories[i].id===id) return STATE.categories[i]; return null; }
function activeCats(){ return STATE.categories.filter(function(c){return !c.deleted;}); }
/* orden de categorías (preferencia por-dispositivo): grupo | az | uso */
function catSortMode(){ return localStorage.getItem("gastos-catsort")||"grupo"; }
function setCatSortMode(v){ try{ localStorage.setItem("gastos-catsort", v); }catch(e){} }
function catUsage(){ var m={}; STATE.expenses.forEach(function(e){ if(!e.deleted && e.status==="confirmado"){ var k=e.categoryId||""; m[k]=(m[k]||0)+1; } }); return m; }
function sortedCats(){
  var mode=catSortMode(), cats=activeCats().slice();
  if(mode==="az"){ cats.sort(function(a,b){ return a.name.localeCompare(b.name,"es"); }); }
  else if(mode==="uso"){ var u=catUsage(); cats.sort(function(a,b){ return (u[b.id]||0)-(u[a.id]||0) || a.name.localeCompare(b.name,"es"); }); }
  return cats;
}
function otherPerson(p){ return p==="A"?"B":"A"; }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function nm(p){ return STATE.names[p]||("Persona "+p); }

/* ---------- tarjetas de crédito ---------- */
/* normaliza cards a objetos {name, close} (antes eran strings) */
function normalizeCards(state){
  if(!state.cards) state.cards={A:[],B:[]};
  ["A","B"].forEach(function(p){
    var arr=state.cards[p]||[];
    state.cards[p]=arr.map(function(c){ return typeof c==="string" ? {name:c, close:null} : {name:c.name, close:(c.close!=null?c.close:null)}; });
  });
  return state;
}
function cardsOf(p){ return (STATE.cards && STATE.cards[p])||[]; }
function findCard(name){ var f=null; ["A","B"].forEach(function(p){ cardsOf(p).forEach(function(c){ if(c.name===name) f=c; }); }); return f; }
/* compra con tarjeta que todavía no se pagó → provisional (no cuenta como gasto real) */
function isProvisional(e){ return !!(e.credit && !e.paid); }
/* mes en que cae el pago de una compra, según el día de cierre de la tarjeta */
function payMonthFor(card, purchaseDateStr){
  var d=parseDate(purchaseDateStr);
  var close=(card && card.close!=null && card.close!=="") ? parseInt(card.close,10) : 0;
  var delta=(close>0 && d.getDate()>close) ? 2 : 1;   // comprado DESPUÉS del cierre → cae un mes más tarde
  var pm=new Date(d.getFullYear(), d.getMonth()+delta, 1);
  return pm.getFullYear()+"-"+pad(pm.getMonth()+1);
}
function provisionalOfMonth(mk){ return STATE.expenses.filter(function(e){ return !e.deleted && e.credit && !e.paid && monthKey(e.date)===mk; }); }
/* deuda futura de un mes separada en común vs individual (por persona) */
function futureDebtSplit(mk){
  var comun=0, indA=0, indB=0;
  provisionalOfMonth(mk).forEach(function(e){ var a=Number(e.amount); if(e.type==="comun") comun+=a; else if(e.owner==="A") indA+=a; else if(e.owner==="B") indB+=a; });
  return {comun:comun, indA:indA, indB:indB, ind:indA+indB};
}
function futureDebtByMonth(fromMk){
  var map={};
  STATE.expenses.forEach(function(e){ if(!e.deleted && e.credit && !e.paid){ var mk=monthKey(e.date); if(mk>=fromMk) map[mk]=(map[mk]||0)+Number(e.amount); } });
  return Object.keys(map).sort().map(function(mk){ return {mk:mk, amount:map[mk]}; });
}
function payCardMonth(card, mk){
  var n=0;
  STATE.expenses.forEach(function(e){ if(!e.deleted && e.credit && !e.paid && (e.cardId||"")===card && monthKey(e.date)===mk){ e.paid=true; e.updatedAt=now(); n++; } });
  if(n){ persist(); render(); toast("Resumen pagado ("+n+")"); }
}

/* gastos visibles (no borrados, confirmados) de un mes */
function confirmedExpensesOfMonth(mk){
  return STATE.expenses.filter(function(e){
    return !e.deleted && e.status==="confirmado" && monthKey(e.date)===mk;
  });
}
function pendingFor(person){
  return STATE.expenses.filter(function(e){
    return !e.deleted && e.status==="pendiente" && e.owner===person;
  });
}

/* ---------- cálculos ---------- */
function categoryTotals(list){
  var map={}, total=0;
  list.forEach(function(e){ map[e.categoryId]=(map[e.categoryId]||0)+Number(e.amount); total+=Number(e.amount); });
  var arr=Object.keys(map).map(function(id){ var c=catById(id); return {id:id, name:c?c.name:"(sin categoría)", color:c?c.color:"#9AA1AC", amount:map[id]}; });
  arr.sort(function(a,b){ return b.amount-a.amount; });
  return {rows:arr, total:total};
}
/* análisis por categoría del mes, filtrable por persona.
   who="all" → total del hogar; who="A"/"B" → sus individuales completos + su mitad de comunes.
   siempre excluye compras con tarjeta sin pagar (provisionales). */
function categoryTotalsFor(mk, who){
  var conf=confirmedExpensesOfMonth(mk).filter(function(e){ return !isProvisional(e); });
  var map={}, cnt={}, total=0, count=0;
  conf.forEach(function(e){
    var amt=Number(e.amount), share=0;
    if(who==="all") share=amt;
    else if(e.type==="comun") share=amt/2;       // mitad de comunes
    else if(e.owner===who) share=amt;            // sus individuales completos
    if(share>0){ map[e.categoryId]=(map[e.categoryId]||0)+share; cnt[e.categoryId]=(cnt[e.categoryId]||0)+1; total+=share; count++; }
  });
  var arr=Object.keys(map).map(function(id){ var c=catById(id); return {id:id, name:c?c.name:"(sin categoría)", color:c?c.color:"#9AA1AC", amount:map[id], cnt:cnt[id]}; });
  arr.sort(function(a,b){ return b.amount-a.amount; });
  return {rows:arr, total:total, count:count};
}
/* orden de las categorías del Análisis (preferencia por-dispositivo) */
function anSortMode(){ return localStorage.getItem("gastos-ansort")||"mayor"; }
function setAnSortMode(v){ try{ localStorage.setItem("gastos-ansort", v); }catch(e){} }
function sortAnalysisRows(rows, mode){
  var r=rows.slice();
  if(mode==="menor") r.sort(function(a,b){ return a.amount-b.amount; });
  else if(mode==="az") r.sort(function(a,b){ return a.name.localeCompare(b.name,"es"); });
  else if(mode==="uso") r.sort(function(a,b){ return (b.cnt||0)-(a.cnt||0) || b.amount-a.amount; });
  else r.sort(function(a,b){ return b.amount-a.amount; }); // mayor (default)
  return r;
}
function segAn(who,label){ return '<button class="'+(UI.anMode===who?'on':'')+'" data-anmode="'+who+'">'+esc(label)+'</button>'; }
function incomeTotal(person, mk){
  return STATE.incomes.reduce(function(s,i){ return (!i.deleted && i.person===person && i.month===mk)? s+Number(i.amount): s; },0);
}
/* panel personal */
function personSummary(person, mk){
  var conf = confirmedExpensesOfMonth(mk);
  var individual=0, comunHalf=0;
  conf.forEach(function(e){
    if(isProvisional(e)) return;   // compra con tarjeta sin pagar: todavía no es gasto
    if(e.type==="comun"){ comunHalf += Number(e.amount)/2; }
    else if(e.owner===person){ individual += Number(e.amount); }
  });
  var ingreso = incomeTotal(person, mk);
  var gastado = individual + comunHalf;
  return { ingreso:ingreso, individual:individual, comunHalf:comunHalf, gastado:gastado, disponible:ingreso-gastado };
}
/* balance A<->B del mes (comunes 50/50 + cruzados confirmados) */
function balanceOfMonth(mk){
  var bOwesA = 0; // positivo => B le debe a A
  STATE.expenses.forEach(function(e){
    if(e.deleted || e.status!=="confirmado" || isProvisional(e)) return;
    if(settleMonthOf(e)!==mk) return;   // la deuda se atribuye al mes de SALDO (arrastra si el mes original está cerrado)
    var amt=Number(e.amount);
    if(e.type==="comun"){
      if(e.paidBy==="A") bOwesA += amt/2; else bOwesA -= amt/2;
    } else if(e.owner && e.paidBy && e.owner!==e.paidBy){ // cruzado confirmado
      if(e.paidBy==="A" && e.owner==="B") bOwesA += amt;
      else if(e.paidBy==="B" && e.owner==="A") bOwesA -= amt;
    }
  });
  // pagos en efectivo del mes saldan la deuda
  STATE.payments.forEach(function(p){
    if(p.deleted || monthKey(p.date)!==mk) return;
    var amt=Number(p.amount);
    if(p.from==="B" && p.to==="A") bOwesA -= amt;      // B le pagó a A: baja lo que B le debe
    else if(p.from==="A" && p.to==="B") bOwesA += amt; // A le pagó a B
  });
  return bOwesA; // >0 B->A, <0 A->B, 0 saldado
}

/* ---------- merge para sync (unión por id + tombstones) ---------- */
function mergeById(cloudArr, localArr){
  var map={};
  (cloudArr||[]).forEach(function(x){ map[x.id]=x; });
  (localArr||[]).forEach(function(x){
    var ex=map[x.id];
    if(!ex || (x.updatedAt||0) >= (ex.updatedAt||0)) map[x.id]=x;
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function mergeState(cloud, local){
  if(!cloud) return local;
  var out = {
    schema:SCHEMA,
    incomes: mergeById(cloud.incomes, local.incomes),
    expenses: mergeById(cloud.expenses, local.expenses),
    payments: mergeById(cloud.payments, local.payments),
    categories: mergeById(cloud.categories, local.categories)
  };
  // config: gana el lado con metaUpdatedAt más nuevo
  if((local.metaUpdatedAt||0) >= (cloud.metaUpdatedAt||0)){
    out.names=local.names; out.budgets=local.budgets; out.cards=local.cards; out.closedMonths=local.closedMonths; out.metaUpdatedAt=local.metaUpdatedAt||0;
  } else {
    out.names=cloud.names||{A:"Persona A",B:"Persona B"}; out.budgets=cloud.budgets||{}; out.cards=cloud.cards||{A:[],B:[]}; out.closedMonths=cloud.closedMonths||[]; out.metaUpdatedAt=cloud.metaUpdatedAt||0;
  }
  if(!out.categories||!out.categories.length) out.categories=defaultCategories();
  return normalizeCards(out);
}

/* ---------- acciones de datos ---------- */
function addIncome(person, mk, source, amount){
  STATE.incomes.push({id:uid(), person:person, month:mk, source:source||"Ingreso", amount:Number(amount), updatedAt:now(), deleted:false});
  persist();
}
function delIncome(id){
  var i=STATE.incomes.find(function(x){return x.id===id;}); if(i){ i.deleted=true; i.updatedAt=now(); persist(); }
}
/* alta de gasto; maneja cuotas y compras con tarjeta (provisionales hasta pagarse) */
function addExpense(data){
  var cuotas = Math.max(1, parseInt(data.cuotas||1,10));
  var credit = (data.method==="credito") || cuotas>1;   // las cuotas son siempre con tarjeta
  var totalAmount = Number(data.amount);
  var per = totalAmount/cuotas;
  var group = cuotas>1 ? uid() : null;
  var card = credit ? findCard(data.cardId) : null;
  var basePM = credit ? payMonthFor(card, data.date) : null;   // mes de pago de la 1ra cuota
  for(var k=0;k<cuotas;k++){
    var dstr;
    if(credit){ dstr = addMonths(basePM,k)+"-01"; }            // cada cuota cae en su mes de pago
    else { dstr = ymd(parseDate(data.date)); }
    var m0 = monthKey(dstr);
    var settle = isClosed(m0) ? nextOpenMonth(m0) : null;      // si el mes está cerrado, la deuda se salda en el próximo abierto
    STATE.expenses.push({
      id:uid(), amount:per, categoryId:data.categoryId, date:dstr, settleMonth:settle,
      paidBy:data.paidBy, type:data.type, owner:data.type==="individual"?data.owner:null,
      status:data.status||"confirmado",
      installment: cuotas>1 ? {group:group, index:k+1, total:cuotas} : null,
      cardId:credit?(data.cardId||null):null,
      credit:credit, paid:credit?false:true, boughtOn:credit?data.date:null,
      note:data.note||"",
      createdBy:DEVICE.person||data.paidBy, updatedAt:now(), deleted:false
    });
  }
  persist();
}
function delExpense(id){
  var e=STATE.expenses.find(function(x){return x.id===id;});
  if(!e) return;
  if(e.installment){
    if(!confirm("Este gasto es parte de una serie de cuotas ("+e.installment.index+"/"+e.installment.total+"). ¿Borrar TODA la serie?")) return;
    STATE.expenses.forEach(function(x){ if(x.installment && x.installment.group===e.installment.group){ x.deleted=true; x.updatedAt=now(); } });
  } else { e.deleted=true; e.updatedAt=now(); }
  persist(); render();
}
function confirmPending(id, accept){
  var e=STATE.expenses.find(function(x){return x.id===id;});
  if(!e) return;
  if(accept){ e.status="confirmado"; } else { e.deleted=true; }
  e.updatedAt=now(); persist(); render();
}
function addPayment(from, amount, date, note){
  STATE.payments.push({id:uid(), from:from, to:otherPerson(from), amount:Number(amount), date:date, note:note||"", updatedAt:now(), deleted:false});
  persist();
}
function delPayment(id){ var p=STATE.payments.find(function(x){return x.id===id;}); if(p){ p.deleted=true; p.updatedAt=now(); persist(); render(); } }
function touchMeta(){ STATE.metaUpdatedAt=now(); }
function toggleClosed(mk){
  if(isClosed(mk)) reopenMonth(mk); else closeMonth(mk);
}
function closeMonth(mk){
  if(!confirm("¿Cerrar "+monthLabel(mk)+"? Queda sellado y el historial se guarda. Podés reabrirlo cuando quieras.")) return;
  if(STATE.closedMonths.indexOf(mk)<0) STATE.closedMonths.push(mk);
  touchMeta(); persist(); render();
}
function reopenMonth(mk){
  var i=STATE.closedMonths.indexOf(mk); if(i>=0) STATE.closedMonths.splice(i,1);
  // borrar el pago de cierre auto-generado de ese mes, para no dejar la deuda mal saldada
  STATE.payments.forEach(function(p){ if(p.closing && p.closingMonth===mk && !p.deleted){ p.deleted=true; p.updatedAt=now(); } });
  // al reabrir, los gastos con fecha en este mes vuelven a saldar acá (se limpia el arrastre que apuntaba a un mes posterior)
  STATE.expenses.forEach(function(e){ if(!e.deleted && e.settleMonth && monthKey(e.date)===mk){ e.settleMonth=null; e.updatedAt=now(); } });
  touchMeta(); persist(); render();
}
function isClosed(mk){ return STATE.closedMonths.indexOf(mk)>=0; }
/* primer mes ABIERTO en/desde mk (para arrastrar deuda de meses cerrados) */
function nextOpenMonth(mk){ var m=mk, i=0; while(isClosed(m) && i<48){ m=addMonths(m,1); i++; } return m; }
/* mes en que se salda la deuda de un gasto: el suyo si está abierto, o el fijado al cargarlo sobre un mes cerrado */
function settleMonthOf(e){ return e.settleMonth || monthKey(e.date); }

/* ---------- reordenar tarjetas (arrastre con agarre; orden por-dispositivo) ---------- */
function cardOrder(){ try{ return JSON.parse(localStorage.getItem("gastos-cardorder")||"[]"); }catch(e){ return []; } }
function setCardOrder(arr){ try{ localStorage.setItem("gastos-cardorder", JSON.stringify(arr)); }catch(e){} }
/* emite los bloques según el orden guardado; los que no estén en el orden van al final */
function emitOrdered(blocks){
  var order=cardOrder(), byKey={}, used={}, out=[];
  blocks.forEach(function(b){ byKey[b.key]=b; });
  order.forEach(function(k){ if(byKey[k]){ out.push(byKey[k]); used[k]=true; } });
  blocks.forEach(function(b){ if(!used[b.key]) out.push(b); });
  return out.map(function(b){
    return '<div class="rblock" data-rkey="'+b.key+'"><div class="grip" data-grip>⠿</div>'+b.html+'</div>';
  }).join('');
}

/* últimos gastos reales del mes — feed lindo (distinto de la lista de Movimientos) */

  list.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  var h='<div class="card"><h2>Últimos gastos<span class="sub" style="text-transform:capitalize">'+monthLabel(mk)+'</span></h2>';
  if(!list.length){ h+=emptyBox("Sin gastos este mes",""); h+='</div>'; return h; }
  h+='<div class="feed">';
  list.slice(0,6).forEach(function(e){
    var c=catById(e.categoryId);
    var col=c?c.color:"#9AA1AC";
    var dt=parseDate(e.date);
    var fecha=dt.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});
    var quien=(e.type==="comun")?"Común":("de "+nm(e.owner||e.paidBy));
    h+='<div class="feed-row">'+

/* SVG donut con segmentos */
function donutSVG(rows, total){
  var size=210, sw=26, r=(size-sw)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  var svg='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">';
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#EEF0F4" stroke-width="'+sw+'"/>';
  if(total>0){
    var acc=0;
    rows.forEach(function(x){
      var frac=x.amount/total; var len=frac*C; var gap=C-len;
      svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+x.color+'" stroke-width="'+sw+'" '+
           'stroke-dasharray="'+len+' '+gap+'" stroke-dashoffset="'+(-acc)+'" stroke-linecap="butt"/>';
      acc+=len;
    });
  }
  svg+='</svg>';
  return svg;
}
function compareCard(mk){
  var prev=addMonths(mk,-1);
  if(panelCollapsed("comparativa")){
    return '<div class="card"><h2>Comparativa con '+monthLabel(prev)+collapseBtn("comparativa")+'</h2>'+
           '<div class="hint" style="margin-top:6px">Oculta · tocá 👁 para verla</div></div>';
  }
  var cur=categoryTotals(confirmedExpensesOfMonth(mk).filter(function(e){return !isProvisional(e);}));
  var pre=categoryTotals(confirmedExpensesOfMonth(prev).filter(function(e){return !isProvisional(e);}));
  var preMap={}; pre.rows.forEach(function(r){ preMap[r.id]=r.amount; });
  var ids={}; cur.rows.forEach(function(r){ids[r.id]=true;}); pre.rows.forEach(function(r){ids[r.id]=true;});
  var rows=Object.keys(ids).map(function(id){
    var c=catById(id); var a=0; cur.rows.forEach(function(r){if(r.id===id)a=r.amount;});
    var b=preMap[id]||0; return {name:c?c.name:"(?)", color:c?c.color:"#9AA1AC", now:a, prev:b, d:a-b};
  }).filter(function(r){return r.now>0||r.prev>0;});
  rows.sort(function(a,b){ return Math.abs(b.d)-Math.abs(a.d); });
  var h='<div class="card"><h2>Comparativa con '+monthLabel(prev)+collapseBtn("comparativa")+'</h2>';
  if(!rows.length){ h+=emptyBox("Sin datos para comparar",""); h+='</div>'; return h; }
  rows.slice(0,8).forEach(function(r){
    var up=r.d>0, flat=Math.abs(r.d)<0.5;
    var arrow= flat?'—':(up?'▲':'▼'); var cls= flat?'':(up?'neg':'pos');
    h+='<div class="cmp"><span class="sw" style="width:11px;height:11px;border-radius:3px;background:'+r.color+'"></span>'+
       '<span class="nm">'+esc(r.name)+'</span>'+
       '<span class="'+cls+' arrow">'+arrow+'</span>'+
       '<span class="delta '+cls+' num">'+(flat?'igual':(up?'+':'−')+money(Math.abs(r.d)).replace('-',''))+'</span></div>';
  });
  h+='</div>';
  return h;
}

/* arrastre de tarjetas con el agarre (pointer events + captura, para que ande en el celu) */
function initReorder(){
  var app=document.getElementById("app"); if(!app) return;
  Array.prototype.forEach.call(app.querySelectorAll("[data-grip]"),function(g){
    g.addEventListener("pointerdown",function(ev){
      ev.preventDefault();
      var block=g.closest(".rblock"); if(!block) return;
      var blocks=Array.prototype.slice.call(app.querySelectorAll(".rblock"));
      var startY=ev.clientY, moved=false;
      try{ g.setPointerCapture(ev.pointerId); }catch(e){}
      block.classList.add("dragging");
      function onMove(e){ moved=true; block.style.transform="translateY("+(e.clientY-startY)+"px)"; }
      function onUp(e){
        g.removeEventListener("pointermove",onMove);
        g.removeEventListener("pointerup",onUp);
        try{ g.releasePointerCapture(ev.pointerId); }catch(_){}
        block.classList.remove("dragging"); block.style.transform="";
        if(moved){
          var y=e.clientY, draggedKey=block.dataset.rkey, idx=0;
          blocks.forEach(function(b){ if(b===block) return; var r=b.getBoundingClientRect(); if(y > r.top + r.height/2) idx++; });
          var order=blocks.map(function(b){return b.dataset.rkey;}).filter(function(k){return k!==draggedKey;});
          order.splice(idx,0,draggedKey);
          setCardOrder(order); render();
        }
      }
      g.addEventListener("pointermove",onMove);
      g.addEventListener("pointerup",onUp);
    });
  });
}
function shiftMv(delta){
  var a=parseDate(UI.mvAnchor);
  if(UI.mvMode==="dia") a.setDate(a.getDate()+delta);
  else if(UI.mvMode==="semana") a.setDate(a.getDate()+7*delta);
  else a.setMonth(a.getMonth()+delta);
  UI.mvAnchor=ymd(a);
}

function handleAct(act,b){

  else if(act==="balance-detail"){ openBalanceDetail(b.dataset.mk); }

function bindLoadForm(which){
  if(which==="gasto"){
    var type="comun", owner=DEVICE.person||"A", cuotas=false, method="efectivo";
    Array.prototype.forEach.call(document.querySelectorAll("[data-type]"),function(b){
      b.addEventListener("click",function(){

      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-owner]"),function(b){
      b.addEventListener("click",function(){
        owner=b.dataset.owner;
        Array.prototype.forEach.call(document.querySelectorAll("[data-owner]"),function(x){ x.className="chip"+(x.dataset.owner===owner?(owner==="A"?" onA":" onB"):""); });
        updateCrossHint();
      });
    });
    // medio de pago: efectivo/débito vs tarjeta de crédito
    Array.prototype.forEach.call(document.querySelectorAll("[data-method]"),function(b){
      b.addEventListener("click",function(){
        method=b.dataset.method;
        Array.prototype.forEach.call(document.querySelectorAll("[data-method]"),function(x){ x.classList.toggle("on", x.dataset.method===method); });
        var credit = method==="credito";
        document.getElementById("cardField").classList.toggle("hidden", !credit);
        document.getElementById("cuotaSwLine").classList.toggle("hidden", !credit);
        if(!credit){ cuotas=false; document.getElementById("cuotaSw").classList.remove("on"); document.getElementById("cuotaBox").classList.add("hidden"); }
        refreshCards();
      });
    });
    var sw=document.getElementById("cuotaSw");
    sw.addEventListener("click",function(){ cuotas=!cuotas; sw.classList.toggle("on",cuotas); document.getElementById("cuotaBox").classList.toggle("hidden",!cuotas); });
    var paid=document.getElementById("g_paid"); paid.value=DEVICE.person||"A";
    paid.addEventListener("change",function(){ refreshCards(); updateCrossHint(); });
    function refreshCards(){
      var sel=document.getElementById("g_card"); if(!sel) return;
      var p=document.getElementById("g_paid").value;
      var cards=cardsOf(p);
      sel.innerHTML = cards.length? cards.map(function(c){return '<option>'+esc(c.name)+'</option>';}).join('') : '<option value="">(sin tarjetas — cargalas en Ajustes)</option>';
    }
    function updateCrossHint(){
      var el=document.getElementById("crossHint"); if(!el) return;
      var paidP=document.getElementById("g_paid").value;
      if(type==="individual" && owner!==paidP){ el.innerHTML='⏳ Queda <b>pendiente</b> hasta que '+esc(nm(owner))+' lo confirme.'; }
      else el.innerHTML='';
    }
    refreshCards(); updateCrossHint();
    document.getElementById("g_save").addEventListener("click",function(){
      var amount=parseFloat(document.getElementById("g_amount").value);
      if(!(amount>0)){ toast("Poné un monto"); return; }
      var paidP=document.getElementById("g_paid").value;
      var credit = method==="credito";
      if(credit && !(document.getElementById("g_card").value||"")){ toast("Elegí una tarjeta (o cargala en Ajustes)"); return; }
      var isCross = type==="individual" && owner!==paidP;
      var gdate=document.getElementById("g_date").value||ymd(new Date());
      addExpense({
        amount:amount, categoryId:document.getElementById("g_cat").value,
        date:gdate,
        paidBy:paidP, type:type, owner:owner,
        status:isCross?"pendiente":"confirmado",
        method:method,
        cuotas: (credit && cuotas)? (parseInt(document.getElementById("g_cuotas").value,10)||1):1,
        cardId: credit? (document.getElementById("g_card").value||null):null,
        note:document.getElementById("g_note").value
      });
      var gm=monthKey(gdate);
      if(!credit && isClosed(gm) && !isCross){ toast(cap(monthLabel(gm))+" está cerrado — la deuda se salda en "+cap(monthLabel(nextOpenMonth(gm)))); }
      else toast(isCross?"Cargado (pendiente de confirmar)":(credit?"Compra con tarjeta cargada":"Gasto guardado"));
      setTab("movimientos");
    });
  } else {
    var inc=DEVICE.person||"A";
    Array.prototype.forEach.call(document.querySelectorAll("[data-inc]"),function(b){
      b.addEventListener("click",function(){ inc=b.dataset.inc; Array.prototype.forEach.call(document.querySelectorAll("[data-inc]"),function(x){ x.className="chip"+(x.dataset.inc===inc?(inc==="A"?" onA":" onB"):""); }); });
    });
    document.getElementById("i_save").addEventListener("click",function(){
      var amount=parseFloat(document.getElementById("i_amount").value);
      if(!(amount>0)){ toast("Poné un monto"); return; }
      addIncome(inc, document.getElementById("i_month").value||todayMonth(), document.getElementById("i_source").value, amount);
      toast("Ingreso guardado"); setTab("resumen");
    });
  }
}

function openBalanceDetail(mk){
  var items=[];
  STATE.expenses.forEach(function(e){
    if(e.deleted || e.status!=="confirmado" || isProvisional(e)) return;
    if(settleMonthOf(e)!==mk) return;   // atribuido por mes de SALDO
    var amt=Number(e.amount), c=catById(e.categoryId), nom=(c&&c.emoji?c.emoji+" ":"")+(c?c.name:"(sin categoría)");
    var arr = (e.settleMonth && monthKey(e.date)!==mk) ? " · de "+cap(monthLabel(monthKey(e.date))) : "";  // arrastre de un mes cerrado
    if(e.type==="comun"){
      var d=e.paidBy==="A"?amt/2:-amt/2;
      items.push({label:esc(nom)+" · común", sub:"pagó "+esc(nm(e.paidBy))+" "+money(amt)+" → "+esc(nm(otherPerson(e.paidBy)))+" pone "+money(amt/2)+arr, amt:amt/2, favor:(d>0?"A":"B"), date:e.date});
    } else if(e.owner && e.paidBy && e.owner!==e.paidBy){
      var d2=(e.paidBy==="A"&&e.owner==="B")?amt:((e.paidBy==="B"&&e.owner==="A")?-amt:0);
      if(d2!==0) items.push({label:esc(nom)+" · de "+esc(nm(e.owner)), sub:"pagó "+esc(nm(e.paidBy))+" "+money(amt)+" → "+esc(nm(e.owner))+" le debe "+money(amt)+arr, amt:amt, favor:(d2>0?"A":"B"), date:e.date});
    }
  });
  STATE.payments.forEach(function(p){
    if(p.deleted || monthKey(p.date)!==mk) return;
    var amt=Number(p.amount), d=(p.from==="B"&&p.to==="A")?-amt:((p.from==="A"&&p.to==="B")?amt:0);
    if(d!==0) items.push({label:"Pago en efectivo", sub:esc(nm(p.from))+" le pagó a "+esc(nm(p.to))+" "+money(amt)+(p.note?" · "+esc(p.note):""), amt:amt, favor:(d>0?"A":"B"), pay:true, date:p.date});
  });
  items.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });

  var net=balanceOfMonth(mk);   // el saldo de ESTE mes (coincide con el hero)
  var neto = Math.abs(net)<0.5;
  var dirTxt = neto ? "Están a mano 🤝" : (esc(nm(net>0?"B":"A"))+" le debe a "+esc(nm(net>0?"A":"B")));
  var body='';
  body+='<div style="text-align:center;padding:2px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px">'+
        '<div class="who-owes" style="justify-content:center">'+dirTxt+'</div>'+
        (neto?'':'<div class="amt num">'+money(Math.abs(net))+'</div>')+'</div>';
  if(!items.length){ body+='<div class="hint">Sin gastos comunes, cruzados ni pagos que salden este mes.</div>'; }
  else {
    body+='<div class="hint" style="margin-bottom:6px">De dónde viene:</div>';
    body+='<div class="feed">';
    items.forEach(function(it){
      var col= it.pay ? "var(--muted)" : (it.favor==="A"?"var(--A)":"var(--B)");
      body+='<div class="feed-row"><span class="feed-dot" style="background:'+col+'"></span>'+
        '<div class="feed-body"><div class="feed-top"><span class="feed-cat">'+it.label+'</span>'+
        '<span class="feed-amt num">'+money(it.amt)+'</span></div>'+
        '<div class="feed-sub">'+it.sub+'</div></div></div>';
    });
    body+='</div>';
  }
  body+='<button class="btn secondary" id="bd_close" style="margin-top:14px">Cerrar</button>';
  openSheet("Saldo · "+cap(monthLabel(mk)), body);
  var cb=document.getElementById("bd_close"); if(cb) cb.addEventListener("click", closeSheet);
}
function openPayment(){
  var from=DEVICE.person||'A';
  var body=
    '<div class="field"><label>\u00bfQui\u00e9n entreg\u00f3 el dinero?</label><div class="chips" id="pay_chips">'+
      '<button type="button" class="chip'+(from==='A'?' onA':'')+'" data-payfrom="A">'+esc(nm('A'))+'</button>'+
      '<button type="button" class="chip'+(from==='B'?' onB':'')+'" data-payfrom="B">'+esc(nm('B'))+'</button></div>'+
      '<div class="hint" id="pay_dir"></div></div>'+
    '<div class="field"><label>Monto entregado</label><input id="pay_amount" type="number" inputmode="decimal" placeholder="0"/></div>'+
    '<div class="field"><label>Fecha</label><input id="pay_date" type="date" value="'+ymd(new Date())+'"/></div>'+
    '<div class="field"><label>Nota (opcional)</label><input id="pay_note" placeholder="ej. saldo de julio en efectivo"/></div>'+
    '<div class="hint">Registrar un pago <b>salda la deuda</b>: se descuenta del \u00abqui\u00e9n le debe a qui\u00e9n\u00bb del mes de esa fecha.</div>'+
    '<div class="btn2" style="margin-top:10px"><button class="btn secondary" id="pay_cancel">Cancelar</button><button class="btn" id="pay_save">Registrar</button></div>';
  openSheet('Registrar pago', body);
  function paint(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-payfrom]'),function(x){ x.className='chip'+(x.dataset.payfrom===from?(from==='A'?' onA':' onB'):''); });
    var d=document.getElementById('pay_dir'); if(d) d.innerHTML='\uD83D\uDCB5 '+esc(nm(from))+' le entrega a '+esc(nm(otherPerson(from)));
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-payfrom]'),function(b){ b.addEventListener('click',function(){ from=b.dataset.payfrom; paint(); }); });
  paint();

    closeSheet(); render(); toast('Pago registrado');

}
/* detalle de una categoría: sus gastos, del mes o totales, y por persona */
function openCategoryDetail(catId, mk){
  var scope="mes";   // mes | total
  var who="all";     // all | A | B
  function build(){
    var c=catById(catId);
    var list=STATE.expenses.filter(function(e){
      if(e.deleted || e.status!=="confirmado") return false;
      if((e.categoryId||"")!==(catId||"")) return false;
      if(scope==="mes" && monthKey(e.date)!==mk) return false;
      if(who!=="all" && !(e.type==="comun" || e.owner===who)) return false; // de esa persona: sus individuales + comunes
      return true;
    });
    list.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
    var body='';
    body+='<div class="segbar" style="margin-bottom:8px">'+
      '<button class="'+(scope==="mes"?"on":"")+'" data-scope="mes">'+esc(cap(monthLabel(mk)))+'</button>'+
      '<button class="'+(scope==="total"?"on":"")+'" data-scope="total">Total</button></div>';
    body+='<div class="segbar" style="margin-bottom:10px">'+
      '<button class="'+(who==="all"?"on":"")+'" data-cdwho="all">Ambas</button>'+
      '<button class="'+(who==="A"?"on":"")+'" data-cdwho="A">'+esc(nm("A"))+'</button>'+
      '<button class="'+(who==="B"?"on":"")+'" data-cdwho="B">'+esc(nm("B"))+'</button></div>';
    if(!list.length){
      body+='<div class="hint">Sin gastos en esta categoría'+(scope==="mes"?" este mes":"")+(who!=="all"?" de "+esc(nm(who)):"")+'.</div>';
    } else {
      body+='<div class="feed">';
      list.forEach(function(e){
        var prov=isProvisional(e), dt=parseDate(e.date);
        var half = (who!=="all" && e.type==="comun");                 // mostrar la mitad que le toca a esa persona
        var shown = half ? Number(e.amount)/2 : Number(e.amount);
        var fecha=dt.toLocaleDateString("es-AR", scope==="total"?{day:"numeric",month:"short",year:"2-digit"}:{weekday:"short",day:"numeric",month:"short"});
        var etiqueta = e.type==="comun" ? (half?"Común · su mitad":"Común") : ("de "+nm(e.owner||e.paidBy));
        body+='<div class="feed-row"'+(prov?' style="opacity:.5"':'')+'><span class="feed-dot" style="background:'+(c?c.color:"#9AA1AC")+'"></span>'+
          '<div class="feed-body"><div class="feed-top"><span class="feed-cat">'+esc(etiqueta)+(prov?' · por pagar':'')+'</span>'+
          '<span class="feed-amt num">'+money(shown)+'</span></div>'+
          '<div class="feed-sub">'+cap(fecha)+' · pagó '+esc(nm(e.paidBy))+(e.note?" · "+esc(e.note):"")+'</div></div></div>';
      });
      body+='</div>';
      var realTotal=list.reduce(function(s,e){ if(isProvisional(e)) return s; var half=(who!=="all"&&e.type==="comun"); return s+(half?Number(e.amount)/2:Number(e.amount)); },0);
      var totLabel = "Total"+(scope==="mes"?" del mes":" acumulado")+(who!=="all"?" · "+esc(nm(who)):"");
      body+='<div class="kv big" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><span class="k">'+totLabel+'</span><span class="v num">'+money(realTotal)+'</span></div>';
    }
    body+='<button class="btn secondary" id="cd_close" style="margin-top:14px">Cerrar</button>';
    var title=((c&&c.emoji)?c.emoji+" ":"")+(c?c.name:"(sin categoría)");
    openSheet(title, body);
    Array.prototype.forEach.call(document.querySelectorAll("[data-scope]"),function(b){ b.addEventListener("click",function(){ scope=b.dataset.scope; build(); }); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-cdwho]"),function(b){ b.addEventListener("click",function(){ who=b.dataset.cdwho; build(); }); });
    var cb=document.getElementById("cd_close"); if(cb) cb.addEventListener("click", closeSheet);
  }
  build();
}
function openAddCat(){
  var groupOpts=Object.keys(GROUPS).map(function(g){return '<option value="'+g+'">'+GROUPS[g]+'</option>';}).join('');
  var body='<div class="field"><label>Nombre</label><input id="nc_name" placeholder="ej. Mascota"/></div>'+
    '<div class="field"><label>Emoji (opcional)</label><input id="nc_emoji" placeholder="ej. 🐾" maxlength="4"/><div class="hint">Pegá un emoji desde el teclado del celu.</div></div>'+
    '<div class="field"><label>Grupo (común / individual)</label><select id="nc_group">'+groupOpts+'</select></div>'+
    '<div class="btn2"><button class="btn secondary" id="nc_cancel">Cancelar</button><button class="btn" id="nc_save">Crear</button></div>';
  openSheet("Nueva categoría", body);
  document.getElementById("nc_cancel").addEventListener("click",closeSheet);
  document.getElementById("nc_save").addEventListener("click",function(){
    var name=(document.getElementById("nc_name").value||"").trim(); if(!name){ toast("Poné un nombre"); return; }
    var n=STATE.categories.length;
    STATE.categories.push({id:"c"+uid(), name:name, emoji:(document.getElementById("nc_emoji").value||"").trim(), group:document.getElementById("nc_group").value, color:CAT_COLORS[n%CAT_COLORS.length], updatedAt:now(), deleted:false});
    persist(); closeSheet(); render(); toast("Categoría creada");
  });
}
/* editar una categoría ya creada: nombre, emoji y grupo (común/individual) */
function openEditCat(id){
  var c=catById(id); if(!c) return;
  var groupOpts=Object.keys(GROUPS).map(function(g){return '<option value="'+g+'"'+(c.group===g?' selected':'')+'>'+GROUPS[g]+'</option>';}).join('');
  var body='<div class="field"><label>Nombre</label><input id="ec_name" value="'+esc(c.name)+'"/></div>'+
    '<div class="field"><label>Emoji (opcional)</label><input id="ec_emoji" value="'+esc(c.emoji||"")+'" placeholder="ej. 🛒" maxlength="4"/><div class="hint">Pegá un emoji desde el teclado del celu. Dejalo vacío para quitarlo.</div></div>'+
    '<div class="field"><label>Grupo (común / individual)</label><select id="ec_group">'+groupOpts+'</select></div>'+
    '<div class="btn2"><button class="btn secondary" id="ec_cancel">Cancelar</button><button class="btn" id="ec_save">Guardar</button></div>';
  openSheet("Editar categoría", body);
  document.getElementById("ec_cancel").addEventListener("click",closeSheet);
  document.getElementById("ec_save").addEventListener("click",function(){
    var name=(document.getElementById("ec_name").value||"").trim(); if(!name){ toast("Poné un nombre"); return; }
    c.name=name;
    c.emoji=(document.getElementById("ec_emoji").value||"").trim();
    c.group=document.getElementById("ec_group").value;
    c.updatedAt=now(); persist(); closeSheet(); render(); toast("Categoría actualizada");
  });
}

/* ---------- export / import ---------- */
function doExport(){
  var data=JSON.stringify({app:"gastos-hogar", version:SCHEMA, exportedAt:new Date().toISOString(), state:STATE},null,2);
  var blob=new Blob([data],{type:"application/json"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a");
  a.href=url; a.download="gastos-hogar-"+ymd(new Date())+".json"; a.click(); URL.revokeObjectURL(url);
  toast("Respaldo exportado");
}
function doImport(ev){
  var f=ev.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var obj=JSON.parse(e.target.result);
      var incoming=obj.state||obj;
      if(!incoming.expenses){ toast("Archivo no válido"); return; }
      if(!confirm("¿Importar y FUSIONAR con los datos actuales? No se pierde lo que ya tenés.")) return;
      STATE=mergeState(incoming, STATE); persist(); render(); toast("Datos importados");
    }catch(err){ toast("Error al importar"); }
  };
  rd.readAsText(f);
}

/* ---------- who pill ---------- */
document.getElementById("whoPill").addEventListener("click",function(){ setTab("ajustes"); });

/* ---------- arranque ---------- */
render();
window.__gastosReady = true;
</script>

<!-- ══════════════════════════════════════════════════════════════
     BLOQUE FIREBASE 🔒 — login con EMAIL + CONTRASEÑA, con ventana
     clara (botones «Entrar» y «Crear cuenta») y estado honesto.
     Completá firebaseConfig y no toques la lógica. La app funciona
     sin esto (guarda en el celular).
══════════════════════════════════════════════════════════════════ -->
<script type="module">
  // 🔒 1) Pegá acá la config de tu proyecto de Firebase (los 7 campos, de la consola)
  const firebaseConfig = {
    apiKey: "AIzaSyAHVeO8eQ9REcMibZbQkkQJwCiKWr0i8pc",
 		 authDomain: "evolist-f12dd.firebaseapp.com",
 		 databaseURL: "https://evolist-f12dd-default-rtdb.firebaseio.com",
  		 projectId: "evolist-f12dd",
  		storageBucket: "evolist-f12dd.firebasestorage.app",
  		messagingSenderId: "874381505458",
  		appId: "1:874381505458:web:560bc5fff6aa7deff42aab"

  };
  // 🔒 2) Nodo compartido: las dos leen y escriben del MISMO lugar. Dejalo así.
  const SHARED_PATH = "hogar/data";

  const CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== "TU_API_KEY";

  const setStatus = (txt,color) => {
    const el=document.getElementById("authStatus");
    if(el){ el.textContent=txt; el.style.color=color||"var(--muted)"; }
  };

  if(!CONFIGURED){
    window.addEventListener("load",()=>{ setStatus("🔓 Sync sin configurar (funciona local)","var(--muted)"); });
    window.handleSaveCloud = () => alert("Falta configurar Firebase (bloque 🔒 en el código). La app igual guarda en este celular.");
    window.handleSync = window.handleSaveCloud;
  } else {
   try {
    const [{ initializeApp }, dbMod, authMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"),
      import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js")
    ]);
    const { getDatabase, ref, set, get } = dbMod;
    const { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } = authMod;

    const app=initializeApp(firebaseConfig);
    const db=getDatabase(app);
    const auth=getAuth(app);          // la sesión persiste sola entre reinicios
    let user=null, lastSyncOk=null;

    const hhmm=()=>new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    function refreshStatus(){
      if(user) setStatus("✅ Conectada · "+user.email,"var(--ok)");
      else if(lastSyncOk) setStatus("💾 Datos guardados "+lastSyncOk+" · tocá Sincronizar para actualizar","var(--ink)");
      else setStatus("🔓 Sin conectar","var(--muted)");
    }
    onAuthStateChanged(auth,(u)=>{ user=u; refreshStatus(); });

    // ventana de login clara: campos reales + botones «Entrar» y «Crear cuenta»
    function loginModal(){
      return new Promise((resolve)=>{
        const bg=document.createElement("div");
        bg.style.cssText="position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:9999;display:flex;align-items:flex-end;justify-content:center";
        bg.innerHTML=
          '<div style="background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))">'+
            '<div style="width:40px;height:4px;border-radius:999px;background:#E7E9EE;margin:0 auto 16px"></div>'+
            '<h3 style="margin:0 0 4px;font-size:18px">Conectar sincronización</h3>'+
            '<p style="margin:0 0 16px;color:#6B7280;font-size:13px">Usá tu email. La <b>primera vez</b> elegí una contraseña y tocá «Crear cuenta». Las próximas veces, «Entrar».</p>'+
            '<label style="display:block;font-size:12.5px;font-weight:700;color:#6B7280;margin-bottom:6px">Email</label>'+
            '<input id="lg_email" type="email" autocomplete="username" style="width:100%;padding:12px 13px;border:1px solid #E7E9EE;border-radius:12px;font-size:16px;margin-bottom:12px;box-sizing:border-box"/>'+
            '<label style="display:block;font-size:12.5px;font-weight:700;color:#6B7280;margin-bottom:6px">Contraseña (mínimo 6)</label>'+
            '<input id="lg_pass" type="password" autocomplete="current-password" style="width:100%;padding:12px 13px;border:1px solid #E7E9EE;border-radius:12px;font-size:16px;margin-bottom:8px;box-sizing:border-box"/>'+
            '<div id="lg_err" style="color:#D8503A;font-size:12.5px;font-weight:600;min-height:18px;margin-bottom:8px"></div>'+
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
              '<button id="lg_create" style="padding:14px;border-radius:13px;font-weight:800;font-size:15px;background:#fff;border:1px solid #E7E9EE;color:#1F2430">Crear cuenta</button>'+
              '<button id="lg_enter" style="padding:14px;border-radius:13px;font-weight:800;font-size:15px;background:#4B5CC4;border:none;color:#fff">Entrar</button>'+
            '</div>'+
            '<button id="lg_cancel" style="width:100%;margin-top:10px;padding:10px;background:none;border:none;color:#6B7280;font-weight:700">Cancelar</button>'+
          '</div>';
        document.body.appendChild(bg);
        const err=(m)=>{ bg.querySelector("#lg_err").textContent=m; };
        const close=(val)=>{ bg.remove(); resolve(val); };
        const vals=()=>({email:(bg.querySelector("#lg_email").value||"").trim(), pass:bg.querySelector("#lg_pass").value||""});
        bg.addEventListener("click",(e)=>{ if(e.target===bg) close(false); });
        bg.querySelector("#lg_cancel").onclick=()=>close(false);
        bg.querySelector("#lg_enter").onclick=async()=>{
          const {email,pass}=vals();
          if(!email||!pass){ err("Completá email y contraseña."); return; }
          try{ await signInWithEmailAndPassword(auth,email,pass); close(true); }
          catch(ex){ const c=ex.code||"";
            if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found") err("Email o contraseña incorrectos. Si es tu primera vez, tocá «Crear cuenta».");
            else if(c==="auth/invalid-email") err("Ese email no tiene un formato válido.");
            else err(ex.message); }
        };
        bg.querySelector("#lg_create").onclick=async()=>{
          const {email,pass}=vals();
          if(!email||!pass){ err("Completá email y contraseña."); return; }
          if(pass.length<6){ err("La contraseña necesita al menos 6 caracteres."); return; }
          try{ await createUserWithEmailAndPassword(auth,email,pass); close(true); }
          catch(ex){ const c=ex.code||"";
            if(c==="auth/email-already-in-use") err("Esa cuenta ya existe. Tocá «Entrar» con tu contraseña.");
            else if(c==="auth/invalid-email") err("Ese email no tiene un formato válido.");
            else err(ex.message); }
        };
      });
    }

    async function pushMerged(){
      const snap=await get(ref(db,SHARED_PATH));
      const cloud=snap.exists()?snap.val():null;
      const merged=window.GastosStore.merge(cloud);           // fusiona nube→local por id y devuelve el resultado
      merged.lastSynced=new Date().toISOString();
      const clean=JSON.parse(JSON.stringify(merged));         // saca undefined/NaN (Firebase los rechaza)
      await set(ref(db,SHARED_PATH), clean);                  // sube el merge para que la otra lo vea
      lastSyncOk=hhmm();
      return merged;
    }

    async function doPush(btnId, okLabel){
      if(!user){ const ok=await loginModal(); if(!ok) return; }
      const btn=document.getElementById(btnId); const t=btn?btn.textContent:"";
      if(btn){ btn.textContent="⏳..."; btn.disabled=true; }
      try{ await pushMerged(); if(btn) btn.textContent=okLabel; setStatus("✅ "+okLabel+" "+lastSyncOk+(user?" · "+user.email:""),"var(--ok)"); }
      catch(err){
        if(btn) btn.textContent="❌";
        if((err.code||"")==="PERMISSION_DENIED" || /permission/i.test(err.message||""))
          alert("Permiso denegado: el email con el que entraste no está en las Reglas de Firebase, o no coincide exacto. Revisá que sea uno de los dos autorizados.");
        else alert("Error: "+err.message);
      }
      setTimeout(()=>{ if(btn){ btn.textContent=t; btn.disabled=false; } refreshStatus(); },2000);
    }

    window.handleSaveCloud=()=>doPush("saveCloudBtn","Guardado");
    window.handleSync=()=>doPush("syncBtn","Al día");
   } catch(err){
    // No se pudo bajar el SDK de Firebase (sin internet, offline, o el visor bloquea módulos externos).
    // La app sigue funcionando local; solo avisamos con calma en vez de tirar un error.
    window.addEventListener("load",()=>{ setStatus("🔌 Sync sin conexión · la app funciona en este celular","var(--muted)"); });
    window.handleSaveCloud=()=>alert("No se pudo cargar Firebase (sin conexión o el visor lo bloquea). La app igual guarda en este celular; probá desde el sitio publicado con internet.");
    window.handleSync=window.handleSaveCloud;
   }
  }

  // enganchamos los botones (existan ahora o tras un re-render)
  document.addEventListener("click",(ev)=>{
    const s=ev.target.closest("#saveCloudBtn"); const y=ev.target.closest("#syncBtn");
    if(s && window.handleSaveCloud) window.handleSaveCloud();
    if(y && window.handleSync) window.handleSync();
  });
</script>
